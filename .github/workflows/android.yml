name: Android APK

on:
  push:
    branches: [main]
    paths-ignore: ["README.md"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Inštalácia Capacitoru
        run: npm install

      - name: Príprava webových súborov
        run: npm run www

      - name: Vytvorenie Android projektu
        run: npx cap add android

      - name: Ikony aplikácie
        run: npx capacitor-assets generate --android

      - name: Číslo verzie
        run: |
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: Synchronizácia
        run: npx cap sync android

      - name: Podpisový kľúč (stály, aby šli aktualizácie)
        run: |
          mkdir -p ~/.android
          cp android-signing/debug.keystore ~/.android/debug.keystore

      - name: Zostavenie APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Premenovanie
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Pocasie.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Pocasie-apk
          path: Pocasie.apk

      - name: Zverejnenie v Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Počasie 1.0.${{ github.run_number }}
          body: |
            Android aplikácia Počasie. Stiahni **Pocasie.apk** a otvor ho v telefóne.
            Pri prvej inštalácii treba povoliť inštaláciu z neznámych zdrojov.
          files: Pocasie.apk
          make_latest: true
